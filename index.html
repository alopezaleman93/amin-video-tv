<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Amín cumple 8 · Video TV</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif; }
    body { display: grid; place-items: center; }
    #player { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
    #start {
      position: fixed; inset: 0; display: grid; place-items: center; gap: 12px; padding: 24px;
      border: 0; color: #fff; background: #000; text-align: center; cursor: pointer;
    }
    #start .title { font-size: clamp(28px, 5vw, 64px); font-weight: 800; }
    #start .hint { font-size: clamp(16px, 2vw, 24px); opacity: .8; }
    #start.hidden { display: none; }
    #notice { position: fixed; left: 16px; right: 16px; bottom: 16px; color: #fff; background: #222; padding: 10px 14px; text-align: center; font-size: 14px; }
    #notice.hidden { display: none; }
  </style>
</head>
<body>
  <iframe id="player"
    src="https://drive.google.com/file/d/13bv6n8ZkpSJQkQHihCi7knLice-_IKeF/preview"
    allow="autoplay; fullscreen"
    allowfullscreen
    title="Video del cumpleaños de Amín"></iframe>

  <button id="start" type="button" aria-label="Iniciar video">
    <span>
      <span class="title">AMÍN CUMPLE 8</span><br>
      <span class="hint">▶ Tocar para abrir el video en pantalla completa</span>
    </span>
  </button>
  <div id="notice">Si el video no aparece, verificá que Google Drive permita el acceso a “Cualquier persona con el enlace”. El bucle automático depende del reproductor de Drive.</div>

  <script>
    const player = document.getElementById('player');
    const start = document.getElementById('start');
    const notice = document.getElementById('notice');

    start.addEventListener('click', async () => {
      start.classList.add('hidden');
      notice.classList.add('hidden');
      try {
        if (player.requestFullscreen) await player.requestFullscreen();
        else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      } catch (_) {}
    });

    // Al salir de pantalla completa, permite volver a mostrar la indicación inicial.
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        start.classList.remove('hidden');
        notice.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
