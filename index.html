<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Amín cumple 8 · Video TV</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; min-height: 100%;
      overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif;
    }
    body { display: grid; place-items: center; }
    #player {
      position: fixed; inset: 0; display: block;
      width: 100%; height: 100%; background: #000;
      object-fit: contain;
    }
    #start {
      position: fixed; inset: 0; z-index: 2;
      display: grid; place-items: center; gap: 12px; padding: 24px;
      border: 0; color: #fff;
      background: radial-gradient(ellipse at center, rgba(35,35,35,.82), rgba(0,0,0,.96));
      text-align: center; cursor: pointer;
    }
    #start .title { font-size: clamp(28px, 5vw, 64px); font-weight: 800; }
    #start .hint { display: inline-block; margin-top: 14px; font-size: clamp(16px, 2vw, 24px); opacity: .9; }
    #start .button {
      display: inline-block; margin-top: 22px; padding: 14px 24px;
      border-radius: 999px; background: #fff; color: #111; font-weight: 700;
      font-size: 16px;
    }
    #start.hidden { display: none; }
    #error {
      position: fixed; z-index: 3; left: 16px; right: 16px; bottom: 16px;
      color: #fff; background: #7a1b1b; padding: 12px 16px;
      text-align: center; font-size: 14px; display: none;
    }
    #error.visible { display: block; }
  </style>
</head>
<body>
  <video id="player" autoplay muted loop playsinline preload="auto">
    <source src="./jurassic_amin.mp4" type="video/mp4">
    Tu navegador no puede reproducir este video.
  </video>

  <button id="start" type="button" aria-label="Reproducir video en pantalla completa">
    <span>
      <span class="title">AMÍN CUMPLE 8</span><br>
      <span class="hint">La aventura está por comenzar</span><br>
      <span class="button">▶ REPRODUCIR EN PANTALLA COMPLETA</span>
    </span>
  </button>
  <div id="error" role="alert">No se pudo cargar el video. Verificá que jurassic_amin.mp4 esté en la raíz del repositorio y que el nombre coincida exactamente.</div>

  <script>
    const player = document.getElementById('player');
    const start = document.getElementById('start');
    const error = document.getElementById('error');

    // Los navegadores suelen permitir autoplay únicamente si comienza silenciado.
    player.play().catch(() => {
      // El botón de inicio permite arrancarlo mediante una acción del usuario.
    });

    player.addEventListener('error', () => error.classList.add('visible'));

    start.addEventListener('click', async () => {
      error.classList.remove('visible');
      try {
        player.muted = false;
        await player.play();
      } catch (_) {
        // Si el navegador bloquea el audio, iniciar igualmente silenciado.
        player.muted = true;
        try { await player.play(); } catch (_) {}
      }

      try {
        if (player.requestFullscreen) await player.requestFullscreen();
        else if (player.webkitEnterFullscreen) player.webkitEnterFullscreen();
        else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      } catch (_) {
        // Algunos navegadores móviles no permiten fullscreen por API; el video sigue a pantalla completa dentro de la página.
      }
      start.classList.add('hidden');
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) start.classList.remove('hidden');
    });
  </script>
</body>
</html>
